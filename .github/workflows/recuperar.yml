name: Recuperar lacunas

# Refaz na API do SimCAQ os municipios que faltam no dataset de microdados.
# O plano (plano/plano_lacunas.json) e dividido em fatias; cada fatia e um job.
# Resultado: artefato "recuperados-consolidado" (recuperados.tar.gz + logs + CSVs).

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Em quantas fatias dividir o plano (1 job por fatia)"
        type: number
        default: 24
      max_parallel:
        description: "Quantos jobs ao mesmo tempo (carga total na API = este valor x teto por job)"
        type: number
        default: 3
      workers:
        description: "Threads por job"
        type: number
        default: 4
      max_por_seg:
        description: "Teto de requisicoes por segundo, por job"
        type: number
        default: 2
      amostra:
        description: "Teste: so N requisicoes por fatia (0 = tudo)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: recuperar-lacunas
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.lista.outputs.shards }}
    steps:
      - id: lista
        env:
          N: ${{ inputs.shards }}
        run: |
          python3 -c "import json,os; print('shards=' + json.dumps(list(range(int(float(os.environ['N']))))))" >> "$GITHUB_OUTPUT"

  recuperar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.preparar.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Executar fatia ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          WORKERS: ${{ inputs.workers }}
          MAX_POR_SEG: ${{ inputs.max_por_seg }}
          AMOSTRA: ${{ inputs.amostra }}
        run: |
          EXTRA=""
          if [ "$AMOSTRA" != "0" ]; then EXTRA="--amostra $AMOSTRA"; fi
          python3 refazer_lacunas.py executar \
            --plano plano/plano_lacunas.json \
            --municipios dados/_municipios_piaui.json \
            --raiz /nao-existe --sem-dataset \
            --nova saida/nova \
            --logs "saida/logs/shard-$SHARD" \
            --shard "$SHARD" --shards "$SHARDS" \
            --workers "$WORKERS" --max-por-seg "$MAX_POR_SEG" \
            --max-minutos 330 $EXTRA

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recuperados-${{ matrix.shard }}
          path: saida/
          if-no-files-found: ignore
          retention-days: 3

  consolidar:
    needs: recuperar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: recuperados-*
          path: artefatos
          merge-multiple: true

      - name: Consolidar logs, relatorios e pacote
        run: python3 consolidar.py artefatos plano/plano_lacunas.json consolidado

      - uses: actions/upload-artifact@v4
        with:
          name: recuperados-consolidado
          path: consolidado/
          compression-level: 0
          retention-days: 30
